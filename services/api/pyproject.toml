[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ielts-reading-api"
version = "1.0.0"
description = "Business API for the IELTS Reading Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "libsql>=0.1,<1",
  "openai>=2.46,<3",
  "python-docx>=1.1,<2",
  "reportlab>=4,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx2>=2.9,<3", "ruff>=0.16.1,<0.17"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E7", "E9", "F", "B"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
