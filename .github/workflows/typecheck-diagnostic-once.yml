name: typecheck-diagnostic-once

on:
  push:
    branches:
      - agent/review-methods-ability
    paths:
      - .github/workflows/typecheck-diagnostic-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/review-methods-ability
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - name: Capture TypeScript output
        run: |
          set +e
          pnpm typecheck:web > typecheck-diagnostic.log 2>&1
          code=$?
          echo "exit_code=$code" >> typecheck-diagnostic.log
          exit 0
      - name: Commit diagnostic log
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f typecheck-diagnostic.log
          git commit -m "临时记录TypeScript诊断输出"
          git push origin HEAD:agent/review-methods-ability
