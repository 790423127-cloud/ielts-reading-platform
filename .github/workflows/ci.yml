name: platform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Capture TypeScript diagnostics
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck:web 2>&1 | tee typecheck-diagnostic.log
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostic
          path: typecheck-diagnostic.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail on TypeScript errors
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - run: pnpm test:web
      - run: pnpm build:web

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e "services/api[dev]"
      - run: pytest services/api/tests -q
