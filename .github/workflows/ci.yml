name: platform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck:web
      - run: pnpm test:web
      - run: pnpm build:web

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e "services/api[dev]"
      - name: Run API tests
        shell: bash
        run: |
          set -o pipefail
          pytest services/api/tests -q 2>&1 | tee pytest.log
      - name: Upload API failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-pytest-log
          path: pytest.log
          retention-days: 7
