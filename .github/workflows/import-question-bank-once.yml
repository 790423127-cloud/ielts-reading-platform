name: import-question-bank-once

on:
  push:
    branches:
      - agent/import-46-question-bank
    paths:
      - .github/workflows/import-question-bank-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-0118-820b-857e-b6c98930f34f/raw?se=2026-07-25T20:49:36Z&sp=r&sv=2026-02-06&sr=b&scid=f410d1d9-cc8b-53eb-b25d-508070e232b0&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-25T07:59:58Z&ske=2026-07-27T07:59:58Z&sks=b&skv=2026-02-06&sig=Rhljg3ppOOKfF8A3OKRSbZGM7ok85vJCrjVYYttOdG8%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-46-question-bank
      - name: Download exact export artifact
        run: |
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/question-bank-export.zip
          mkdir -p /tmp/question-bank-export
          unzip -q /tmp/question-bank-export.zip -d /tmp/question-bank-export
      - name: Import exact bytes and validate inventory and hashes
        run: |
          rm -rf services/api/data/question-bank
          mkdir -p services/api/data/question-bank
          cp -a /tmp/question-bank-export/. services/api/data/question-bank/
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          root = Path('services/api/data/question-bank')
          manifest = json.loads((root / 'migration_manifest.json').read_text('utf-8'))
          index = json.loads((root / 'test_index.json').read_text('utf-8'))
          assert len(index) == 46, len(index)
          assert len(manifest['tests']) == 46, len(manifest['tests'])
          assert manifest['total_questions'] == 1840, manifest['total_questions']
          index_ids = [item['id'] for item in index]
          manifest_ids = [item['id'] for item in manifest['tests']]
          assert index_ids == manifest_ids
          total = 0
          for item in manifest['tests']:
              path = root / 'tests' / f"{item['id']}.json"
              raw = path.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == item['sha256'], item['id']
              test = json.loads(raw.decode('utf-8'))
              assert test['id'] == item['id']
              count = sum(
                  len(group.get('questions') or [])
                  for part in test.get('parts') or []
                  for group in part.get('groups') or []
              )
              assert count == 40, (item['id'], count)
              total += count
          assert total == 1840, total
          print(json.dumps({'tests': 46, 'questions': total, 'hashes_verified': 46}))
          PY
      - name: Run backend migration tests
        run: |
          python -m pip install --upgrade pip
          pip install -e "services/api[dev]"
          pytest services/api/tests -q
      - name: Commit imported bank
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f services/api/data/question-bank
          git commit -m "无损迁入46套GT Reading题库并记录逐文件哈希"
          git push origin HEAD:agent/import-46-question-bank
